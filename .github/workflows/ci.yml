name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Budgeter.slnx

      - name: Format check
        run: dotnet format Budgeter.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Budgeter.slnx --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test Budgeter.slnx --no-build --configuration Release \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: TestResults
          if-no-files-found: ignore

  web:
    name: Web build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      # SonarCloud resolves LCOV "SF:" entries against the repository root,
      # but the Angular builder emits them relative to apps/web.
      - name: Normalize coverage paths
        run: find coverage -name lcov.info -type f -exec sed -i "s|^SF:|SF:apps/web/|" {} +

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The TypeScript analyzer resolves types from the installed packages
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global SonarScanner.Tools.DotNet

      - name: Download API coverage
        uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: TestResults

      - name: Download web coverage
        uses: actions/download-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage

      # The .NET scanner is the only one able to analyze C#; it also covers the
      # Angular sources because they are linked as MSBuild items of the solution.
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:ThomasDixini_Budgeter
          /d:sonar.organization=thomasdixini
          /d:sonar.host.url=https://sonarcloud.io
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.scanner.scanAll=true
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.javascript.lcov.reportPaths="apps/web/coverage/**/lcov.info"

      - name: Build
        run: dotnet build Budgeter.slnx --configuration Release

      - name: End analysis
        run: dotnet sonarscanner end

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
