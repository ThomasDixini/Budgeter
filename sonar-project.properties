sonar.projectKey=ThomasDixini_Budgeter
sonar.organization=thomasdixini

sonar.projectName=Budgeter

# sonar.sources and sonar.tests are ignored by the SonarScanner for .NET:
# the analysis scope comes from the MSBuild items of the solution projects.
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**
sonar.coverage.exclusions=**/*.spec.ts

sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/**/lcov.info

sonar.javascript.node.maxspace=4096
sonar.sourceEncoding=UTF-8
