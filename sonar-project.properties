sonar.projectKey=ThomasDixini_Budgeter

# The organization is passed to the scanner through the /o: argument:
# the SonarScanner for .NET rejects the sonar.organization property.
sonar.projectName=Budgeter

# sonar.sources and sonar.tests are ignored by the SonarScanner for .NET:
# the analysis scope comes from the MSBuild items of the solution projects.
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**

# Coverage only counts testable application code. Bootstrap, tooling config,
# and dev scripts are never unit-tested by design, so keeping them in the
# denominator would dilute the metric without improving quality.
sonar.coverage.exclusions=**/*.spec.ts,scripts/**,apps/web/eslint.config.js,apps/web/src/main.ts

sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/**/lcov.info

sonar.javascript.node.maxspace=4096
sonar.sourceEncoding=UTF-8
