<div>
  <div class="bar" aria-hidden="true" [style.height.px]="barHeight()">
    <div class="lanes">
      @for (segment of segments(); track segment.key) {
        <div
          class="segment-slot"
          [style.left.%]="segment.left"
          [style.width.%]="segment.width"
          [style.top.%]="segment.top"
          [style.height.%]="segment.height"
        >
          <div
            class="segment"
            [attr.title]="segment.name + ' · ' + segment.caption"
            [style.background]="segment.background"
            [style.border-color]="segment.border"
          >
            <span class="segment-name">{{ segment.name }}</span>
            <span class="segment-caption" [style.color]="segment.captionColor">{{
              segment.caption
            }}</span>
          </div>
        </div>
      }
    </div>
  </div>
  <div class="ticks" aria-hidden="true">
    @for (tick of ticks(); track tick.label) {
      <span class="tick ui-tabular" [style.left.%]="tick.offset">{{ tick.label }}</span>
    }
  </div>
</div>

@if (issues(); as issues) {
  <div class="issue" role="status">
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M12 9v4M12 17h.01"></path>
      <path
        d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"
      ></path>
    </svg>
    {{ issues }}
  </div>
}
