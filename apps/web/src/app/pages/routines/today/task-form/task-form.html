<form
  class="task-form ui-enter"
  [attr.aria-label]="(isEditing() ? 'Edit task' : 'New task') | t"
  (submit)="submit($event)"
>
  <label class="ui-field">
    {{ 'Task' | t }}
    <input
      class="ui-input"
      type="text"
      maxlength="80"
      [placeholder]="'E.g. Read 20 pages' | t"
      [value]="title()"
      (input)="title.set(valueOf($event))"
    />
  </label>

  <label class="ui-field">
    {{ 'Category' | t }}
    <select class="ui-input" (change)="categoryId.set(valueOf($event))">
      <option value="" [selected]="categoryId() === ''">{{ 'No category' | t }}</option>
      @for (category of categories(); track category.id) {
        <option [value]="category.id" [selected]="category.id === categoryId()">
          {{ category.name }}
        </option>
      }
    </select>
  </label>

  <fieldset class="ui-fieldset">
    <legend class="ui-legend">{{ 'Repeat' | t }}</legend>
    <div class="chips">
      @for (option of repeatOptions; track option.value) {
        <button
          class="ui-chip"
          type="button"
          [attr.aria-pressed]="option.value === repeat()"
          (click)="repeat.set(option.value)"
        >
          {{ option.label | t }}
        </button>
      }
    </div>
    @if (repeat() === 'once') {
      <label class="ui-field once-date">
        {{ 'On' | t }}
        <input
          class="ui-input"
          type="date"
          [min]="earliestDate()"
          [value]="date()"
          (change)="date.set(valueOf($event))"
        />
      </label>
    }
    @if (repeat() === 'weekly') {
      <div class="chips days" role="group" [attr.aria-label]="'Repeat on' | t">
        @for (label of weekdayLabels; track label; let day = $index) {
          <button
            class="ui-chip day"
            type="button"
            [attr.aria-pressed]="days().includes(day)"
            (click)="toggleDay(day)"
          >
            {{ label | t }}
          </button>
        }
      </div>
    }
  </fieldset>

  <div class="actions">
    <button class="ui-button-ghost" type="button" (click)="dismiss.emit()">
      {{ 'Cancel' | t }}
    </button>
    <button class="ui-button-primary" type="submit" [disabled]="!canSave()">
      {{ isEditing() ? ('Save task' | t) : ('Add task' | t) }}
    </button>
  </div>
</form>
