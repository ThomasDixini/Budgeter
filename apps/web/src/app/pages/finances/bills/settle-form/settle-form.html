<form
  class="settle-form ui-enter"
  [attr.aria-label]="'Mark ' + description() + ' ' + verb()"
  (submit)="submit($event)"
  (keydown.escape)="dismiss.emit()"
>
  @if (accounts().length === 0) {
    <p class="ui-muted empty">Add an account to record the movement on.</p>
  }

  <div class="fields">
    <label class="ui-field">
      {{ accountLabel() }}
      <select class="ui-input" name="account" (change)="accountId.set(valueOf($event))">
        @for (account of accounts(); track account.id) {
          <option [value]="account.id" [selected]="account.id === accountId()">
            {{ account.name }}
          </option>
        }
      </select>
    </label>

    <label class="ui-field">
      Date
      <input
        class="ui-input"
        name="date"
        type="date"
        [value]="date()"
        (change)="date.set(valueOf($event))"
      />
    </label>
  </div>

  <div class="actions">
    <button class="ui-button-ghost" type="button" (click)="dismiss.emit()">Cancel</button>
    <button class="ui-button-primary" type="submit" [disabled]="!canSave()">
      Mark as {{ verb() }}
    </button>
  </div>
</form>
