<form
  class="bill-form ui-enter"
  [attr.aria-label]="(isEditing() ? 'Edit bill' : 'New bill') | t"
  (submit)="submit($event)"
  (keydown.escape)="dismiss.emit()"
>
  <div class="chips" role="group" [attr.aria-label]="'Type' | t">
    @for (option of kindOptions; track option.value) {
      <button
        class="ui-chip"
        type="button"
        [attr.aria-pressed]="option.value === kind()"
        (click)="kind.set(option.value)"
      >
        {{ option.label | t }}
      </button>
    }
  </div>

  <div class="fields">
    <label class="ui-field description">
      {{ 'Description' | t }}
      <input
        class="ui-input"
        name="description"
        type="text"
        autocomplete="off"
        [placeholder]="'E.g. Rent' | t"
        [maxLength]="maxDescriptionLength"
        [value]="description()"
        (input)="description.set(valueOf($event))"
      />
    </label>

    <label class="ui-field">
      {{ 'Amount (R$)' | t }}
      <input
        class="ui-input"
        name="amount"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="0.00"
        [value]="amount()"
        [attr.aria-invalid]="amountError() !== undefined"
        [attr.aria-describedby]="amountError() === undefined ? null : 'bill-amount-error'"
        (input)="amount.set(valueOf($event))"
      />
      @if (amountError(); as error) {
        <span id="bill-amount-error" class="error">{{ error | t }}</span>
      }
    </label>

    <label class="ui-field">
      {{ 'Category' | t }}
      <select class="ui-input" name="category" (change)="categoryId.set(valueOf($event))">
        <option value="" disabled [selected]="categoryId() === ''">
          {{ 'Choose a category' | t }}
        </option>
        @for (category of categories(); track category.id) {
          <option [value]="category.id" [selected]="category.id === categoryId()">
            {{ category.name | t }}
          </option>
        }
      </select>
    </label>

    <label class="ui-field">
      {{ 'Due date' | t }}
      <input
        class="ui-input"
        name="dueDate"
        type="date"
        [value]="dueDate()"
        (change)="dueDate.set(valueOf($event))"
      />
    </label>

    @if (isEditing()) {
      @if (seriesNote(); as note) {
        <p class="ui-muted note">
          {{ '{note} · Changes apply to this one only.' | t: { note: note } }}
        </p>
      }
    } @else {
      <label class="ui-field">
        {{ 'Repeat' | t }}
        <select class="ui-input" name="repeat" (change)="chooseRepeat(valueOf($event))">
          @for (option of repeatOptions; track option.value) {
            <option [value]="option.value" [selected]="option.value === repeatKind()">
              {{ option.label | t }}
            </option>
          }
        </select>
      </label>

      @if (isRepeating()) {
        <label class="ui-field">
          {{ repeatKind() === 'installments' ? ('Installments' | t) : ('Occurrences' | t) }}
          <input
            class="ui-input"
            name="count"
            type="number"
            inputmode="numeric"
            [min]="minCount"
            [max]="maxCount"
            [value]="repeatCount()"
            [attr.aria-invalid]="countError() !== undefined"
            [attr.aria-describedby]="countError() === undefined ? null : 'bill-count-error'"
            (input)="repeatCount.set(valueOf($event))"
          />
          @if (countError(); as error) {
            <span id="bill-count-error" class="error">{{ error | t }}</span>
          }
        </label>
      }
    }
  </div>

  <div class="actions">
    @if (isEditing()) {
      <button class="ui-button-ghost delete" type="button" (click)="remove.emit()">
        {{ 'Delete' | t }}
      </button>
    }
    <button class="ui-button-ghost" type="button" (click)="dismiss.emit()">
      {{ 'Cancel' | t }}
    </button>
    <button class="ui-button-primary" type="submit" [disabled]="!canSave()">
      {{ isEditing() ? ('Save bill' | t) : ('Add bill' | t) }}
    </button>
  </div>
</form>
