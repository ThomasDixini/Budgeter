<section class="ui-card card" aria-label="Portfolio distribution">
  <h2 class="title">Portfolio distribution</h2>
  @if (views().length > 0) {
    <div class="bar" role="img" aria-label="Share of each kind of investment">
      @for (view of views(); track view.kind) {
        <span class="segment" [attr.data-kind]="view.kind" [style.flex-grow]="view.percent"></span>
      }
    </div>
    <ul class="legend">
      @for (view of views(); track view.kind) {
        <li>
          <span class="dot" [attr.data-kind]="view.kind"></span>
          <span class="kind">{{ view.label }}</span
          >{{ ' ' }}
          <span class="share ui-tabular">{{ view.percentText }} · {{ view.valueText }}</span>
        </li>
      }
    </ul>
  } @else {
    <p class="empty ui-muted">Nothing invested yet.</p>
  }
</section>
