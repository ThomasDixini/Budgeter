<form
  class="trade-form ui-enter"
  [attr.aria-label]="'Trade {investmentName}' | t: { investmentName: investmentName() }"
  (submit)="submit($event)"
  (keydown.escape)="dismiss.emit()"
>
  <div class="chips" role="group" [attr.aria-label]="'Type' | t">
    @for (option of kindOptions; track option.value) {
      <button
        class="ui-chip"
        type="button"
        [attr.aria-pressed]="option.value === kind()"
        (click)="kind.set(option.value)"
      >
        {{ option.label | t }}
      </button>
    }
  </div>

  <div class="fields">
    <label class="ui-field">
      {{ 'Quantity' | t }}
      <input
        class="ui-input"
        name="quantity"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="100"
        [value]="quantity()"
        [attr.aria-invalid]="quantityError() !== undefined"
        [attr.aria-describedby]="quantityError() === undefined ? null : 'trade-quantity-error'"
        (input)="quantity.set(valueOf($event))"
      />
      @if (quantityError(); as error) {
        <span id="trade-quantity-error" class="error">{{ error | t }}</span>
      }
    </label>

    <label class="ui-field">
      {{ 'Price per unit (R$)' | t }}
      <input
        class="ui-input"
        name="price"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="0.00"
        [value]="price()"
        [attr.aria-invalid]="priceError() !== undefined"
        [attr.aria-describedby]="priceError() === undefined ? null : 'trade-price-error'"
        (input)="price.set(valueOf($event))"
      />
      @if (priceError(); as error) {
        <span id="trade-price-error" class="error">{{ error | t }}</span>
      }
    </label>

    <label class="ui-field">
      {{ 'Date' | t }}
      <input
        class="ui-input"
        name="date"
        type="date"
        [value]="date()"
        (change)="date.set(valueOf($event))"
      />
    </label>
  </div>

  <div class="actions">
    @if (total(); as amount) {
      <p class="total ui-tabular" aria-live="polite">
        {{ 'Total {amount}' | t: { amount: amount } }}
      </p>
    }
    <button class="ui-button-ghost" type="button" (click)="dismiss.emit()">
      {{ 'Cancel' | t }}
    </button>
    <button class="ui-button-primary" type="submit" [disabled]="!canSave()">
      {{ kind() === 'buy' ? ('Record purchase' | t) : ('Record sale' | t) }}
    </button>
  </div>
</form>
