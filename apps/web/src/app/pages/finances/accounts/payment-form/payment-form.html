<form
  class="payment-form ui-enter"
  [attr.aria-label]="'Pay {name}' | t: { name: card().name }"
  (submit)="submit($event)"
  (keydown.escape)="dismiss.emit()"
>
  @if (bankAccounts().length === 0) {
    <p class="ui-muted empty">{{ 'Add a bank account to pay the invoice from.' | t }}</p>
  }

  <div class="fields">
    <label class="ui-field">
      {{ 'Amount (R$)' | t }}
      <input
        class="ui-input"
        name="amount"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="0.00"
        [value]="amount()"
        [attr.aria-invalid]="amountError() !== undefined"
        [attr.aria-describedby]="amountError() === undefined ? null : 'payment-amount-error'"
        (input)="amount.set(valueOf($event))"
      />
      @if (amountError(); as error) {
        <span id="payment-amount-error" class="error">{{ error | t }}</span>
      }
    </label>

    <label class="ui-field">
      {{ 'Paid from' | t }}
      <select class="ui-input" (change)="fromAccountId.set(valueOf($event))">
        @for (account of bankAccounts(); track account.id) {
          <option [value]="account.id" [selected]="account.id === fromAccountId()">
            {{ account.name | t }}
          </option>
        }
      </select>
    </label>

    <label class="ui-field">
      {{ 'Date' | t }}
      <input class="ui-input" type="date" [value]="date()" (change)="date.set(valueOf($event))" />
    </label>
  </div>

  <div class="actions">
    <button class="ui-button-ghost" type="button" (click)="dismiss.emit()">
      {{ 'Cancel' | t }}
    </button>
    <button class="ui-button-primary" type="submit" [disabled]="!canSave()">
      {{ 'Record payment' | t }}
    </button>
  </div>
</form>
