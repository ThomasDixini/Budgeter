<form
  class="transaction-form ui-enter"
  [attr.aria-label]="(isEditing() ? 'Edit transaction' : 'New transaction') | t"
  (submit)="submit($event)"
  (keydown.escape)="dismiss.emit()"
>
  <div class="chips" role="group" [attr.aria-label]="'Type' | t">
    @for (option of typeOptions; track option.value) {
      <button
        class="ui-chip"
        type="button"
        [attr.aria-pressed]="option.value === type()"
        (click)="type.set(option.value)"
      >
        {{ option.label | t }}
      </button>
    }
  </div>

  <div class="fields">
    <label class="ui-field">
      {{ 'Amount (R$)' | t }}
      <input
        class="ui-input"
        name="amount"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        placeholder="0.00"
        [value]="amount()"
        [attr.aria-invalid]="amountError() !== undefined"
        [attr.aria-describedby]="amountError() === undefined ? null : 'transaction-amount-error'"
        (input)="amount.set(valueOf($event))"
      />
      @if (amountError(); as error) {
        <span id="transaction-amount-error" class="error">{{ error | t }}</span>
      }
    </label>

    <label class="ui-field description">
      {{ 'Description' | t }}
      <input
        class="ui-input"
        type="text"
        maxlength="80"
        [placeholder]="'E.g. Groceries' | t"
        [value]="description()"
        (input)="description.set(valueOf($event))"
      />
    </label>

    <label class="ui-field">
      {{ 'Category' | t }}
      <select class="ui-input" (change)="categoryId.set(valueOf($event))">
        <option value="" disabled [selected]="categoryId() === ''">
          {{ 'Choose a category' | t }}
        </option>
        @for (category of categories(); track category.id) {
          <option [value]="category.id" [selected]="category.id === categoryId()">
            {{ category.name | t }}
          </option>
        }
      </select>
    </label>

    <label class="ui-field">
      {{ 'Account' | t }}
      <select class="ui-input" (change)="accountId.set(valueOf($event))">
        <option value="" disabled [selected]="accountId() === ''">
          {{ 'Choose an account' | t }}
        </option>
        @for (account of accounts(); track account.id) {
          <option [value]="account.id" [selected]="account.id === accountId()">
            {{ account.name | t }}
          </option>
        }
      </select>
    </label>

    <label class="ui-field">
      {{ 'Date' | t }}
      <input class="ui-input" type="date" [value]="date()" (change)="date.set(valueOf($event))" />
    </label>
  </div>

  <div class="actions">
    @if (isEditing()) {
      <button class="ui-button-ghost delete" type="button" (click)="remove.emit()">
        {{ 'Delete' | t }}
      </button>
    }
    <button class="ui-button-ghost" type="button" (click)="dismiss.emit()">
      {{ 'Cancel' | t }}
    </button>
    <button class="ui-button-primary" type="submit" [disabled]="!canSave()">
      {{ isEditing() ? ('Save transaction' | t) : ('Add transaction' | t) }}
    </button>
  </div>
</form>
