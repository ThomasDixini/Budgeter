<section class="ui-card chart-card" [attr.aria-label]="title()">
  <header class="head">
    <h2 class="title">{{ title() }}</h2>
    <ul class="legend">
      @for (line of lines(); track line.name) {
        <li>
          <span class="swatch" [class.dashed]="line.dashed" [class.second]="line.index > 0"></span>
          {{ line.name }}
        </li>
      }
    </ul>
  </header>
  @if (hasData()) {
    <svg [attr.viewBox]="'0 0 ' + width + ' ' + height" role="img" [attr.aria-label]="title()">
      @for (tick of ticks(); track $index) {
        <line
          class="grid"
          [attr.x1]="left"
          [attr.x2]="right"
          [attr.y1]="tick.y"
          [attr.y2]="tick.y"
        />
        <text class="axis" [attr.x]="left - 6" [attr.y]="tick.y + 3" text-anchor="end">
          {{ tick.label }}
        </text>
      }
      @for (column of columns(); track $index) {
        <text class="axis" [attr.x]="column.x" [attr.y]="height - 6" text-anchor="middle">
          {{ column.label }}
        </text>
      }
      @for (line of lines(); track line.name) {
        @if (line.index === 0 && line.areaPath) {
          <path class="area" [attr.d]="line.areaPath" />
        }
        <path
          class="line"
          [class.second]="line.index > 0"
          [class.dashed]="line.dashed"
          [attr.d]="line.path"
        />
      }
    </svg>
  } @else {
    <p class="empty ui-muted">{{ emptyText() }}</p>
  }
</section>
