<nav class="dock" [attr.aria-label]="'Switch module' | t" [style.--dock-accent-rgb]="accentRgb()">
  <div class="glow" aria-hidden="true"></div>
  <div class="dome" aria-hidden="true"></div>
  <div class="wheel">
    @for (neighbour of neighbours(); track neighbour.side) {
      @if (neighbour.isAvailable) {
        <a
          [class]="'neighbour neighbour-' + neighbour.side"
          [routerLink]="neighbour.module.route"
          [attr.aria-label]="neighbour.label | t: { name: neighbour.module.name | t }"
          [title]="neighbour.module.name | t"
        >
          <app-module-icon [kind]="neighbour.module.kind" [size]="16" />
        </a>
      } @else {
        <!-- A module that is not built yet keeps its place on the wheel but cannot be opened. -->
        <button
          [class]="'neighbour is-upcoming neighbour-' + neighbour.side"
          type="button"
          disabled
          [attr.aria-label]="neighbour.label | t: { name: neighbour.module.name | t }"
          [title]="neighbour.module.name | t"
        >
          <app-module-icon [kind]="neighbour.module.kind" [size]="16" />
        </button>
      }
    }
    <span class="current" aria-current="page" [title]="current().name | t">
      <app-module-icon [kind]="current().kind" [size]="18" />
    </span>
  </div>
</nav>
